<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sina</title>
  <meta name="description" content="Lecture summaries, questions and flashcards for medical students, built from the lectures and checked against references.">
  <meta name="theme-color" content="#f5efe2">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem("sina:theme");t=t?JSON.parse(t):(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="bar">
      <a class="wordmark" href="#/" aria-label="Sina, home">Sina<span>.</span></a>
      <button class="icon-btn" id="theme-btn" type="button">Dark mode</button>
    </div>
  </header>
  <main id="app"><noscript><div class="wrap"><p>Sina needs JavaScript to show lectures.</p></div></noscript></main>

  <script src="js/data/index.js"></script>
