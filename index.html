<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sina</title>
  <meta name="description" content="Lecture summaries, questions and flashcards for medical students, built from the lectures and checked against references.">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sina">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var t=localStorage.getItem("sina:theme");t=t?JSON.parse(t):(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");if(t!=="dark")t="light";document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="bar">
      <div class="left">
        <button class="menu-btn" id="menu-btn" type="button" aria-label="Open menu" aria-controls="drawer" aria-expanded="false"><span></span><span></span><span></span></button>
        <a class="wordmark" href="#/" aria-label="Sina, home">Sina<span>.</span></a>
      </div>
      <div class="search" id="search">
        <input id="search-input" type="search" placeholder="Search lectures and subjects" aria-label="Search lectures and subjects" autocomplete="off">
        <div class="search-results" id="search-results" hidden></div>
      </div>
      <button class="icon-btn" id="theme-btn" type="button">Dark mode</button>
    </div>
  </header>
  <div id="welcome" class="welcome" hidden>
    <div class="wbox">
      <p class="weyebrow">UM6SS &middot; Faculty of Medicine, Casablanca</p>
      <h1>Welcome to Sina, your study buddy.</h1>
      <p>Lecture summaries, questions, flashcards, 3D models, past papers and extra reading for the promo, built lecture by lecture from our own slides.</p>
      <button class="btn primary big" id="enter" type="button">Start studying</button>
      <p class="wsmall">A study aid, not a replacement for your lectures.</p>
    </div>
  </div>
  <nav id="drawer" class="drawer" aria-label="Site menu" hidden></nav>
  <div id="backdrop" class="backdrop" hidden></div>
  <main id="app"><noscript><div class="wrap"><p>Sina needs JavaScript to show lectures.</p></div></noscript></main>
  <script src="js/data/index.js"></script>
  <script src="js/data/papers.js"></script>
  <script src="js/data/updates.js"></script>
  <script src="js/data/extras.js"></script>
  <script src="js/data/anat3-orbit.js"></script>
  <script src="js/data/anat3-face-osteology.js"></script>
  <script src="js/data/anat3-facial-muscles.js"></script>
  <script src="js/data/anat3-blood-supply.js"></script>
  <script src="js/data/anat3-orbital-appendages.js"></script>
  <script src="js/data/anat3-eyeball-1.js"></script>
  <script src="js/data/anat3-ocular-muscles.js"></script>
  <script src="js/data/anat3-eye-innervation.js"></script>
  <script src="js/data/anat3-ocular-clinical.js"></script>
  <script src="js/data/anat3-sinuses.js"></script>
  <script src="js/data/anat3-oral-cavity.js"></script>
  <script src="js/data/anat3-nasal-cavity.js"></script>
  <script src="js/data/anat3-larynx.js"></script>
  <script src="js/data/anat3-pharynx.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
